name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      skip-gpu:
        description: Skip duplicate advisory GPU tests when called by the release workflow.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify published packages include dist
        run: |
          for pkg in packages/three-dlss-nr; do
            (cd "$pkg" && pnpm pack --dry-run) | grep -qx 'dist/index.js' || {
              echo "::error::dist/index.js missing from the packed tarball for $pkg; the publish step would ship a broken package."
              exit 1
            }
          done

      - name: Type check
        run: pnpm tsc

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm exec oxfmt --check .

      - name: Unit tests with coverage gate
        run: pnpm test

      - name: Release tooling tests
        run: pnpm release:check

      - name: Bundle size gate
        run: pnpm size

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high

      # Keep all development advisories visible; production vulnerabilities block.
      - name: Audit dependencies (advisory)
        id: audit
        continue-on-error: true
        run: pnpm audit --audit-level=high

      - name: Flag audit findings
        if: steps.audit.outcome == 'failure'
        run: echo '::warning::Dependency audit found vulnerabilities or could not reach the registry. Review the audit step.'

      - uses: codecov/codecov-action@v5
        if: ${{ !cancelled() && hashFiles('coverage/lcov.info') != '' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

      - name: Report coverage
        if: always()
        run: node scripts/report-coverage.mjs

  gpu:
    if: ${{ !inputs.skip-gpu }}
    name: GPU (headless WebGPU via Dawn)
    runs-on: ubuntu-latest
    # No GPU on hosted runners: Dawn runs on Mesa's software Vulkan driver
    # (lavapipe), see vitest-environment-webgpu-node and /vitest.config.ts.
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Mesa software Vulkan (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2 libgl1-mesa-dri mesa-vulkan-drivers

      - name: GPU tests
        run: pnpm test:gpu

  coverage-badge:
    name: Publish coverage badge
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage
      - name: Update badge data
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const { total } = JSON.parse(readFileSync('coverage/coverage-summary.json', 'utf8'));
          writeFileSync('/tmp/coverage.json', JSON.stringify({ schemaVersion: 1, label: 'unit coverage', message: `${total.lines.pct}%`, color: 'blue' }));
          JS
          git switch --orphan coverage-badge
          git rm -rf --ignore-unmatch .
          cp /tmp/coverage.json coverage.json
          git add coverage.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: update coverage badge'
          git push origin HEAD:coverage-badge --force
